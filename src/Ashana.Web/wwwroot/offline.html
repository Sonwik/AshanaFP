<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b7380" />
  <title>No connection | Ashana</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #f2f5f6;
      color: #18233f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #0d1430; color: #e8edf8; } p { color: #9da9c6; } }
    main { max-width: 26rem; display: grid; gap: 0.75rem; justify-items: center; }
    img { width: 64px; height: 64px; }
    h1 { margin: 0.5rem 0 0; font-size: 1.6rem; }
    p { margin: 0; color: #566380; line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      background: #f2a516;
      color: #18233f;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/favicon.svg" alt="" />
    <h1>You are offline</h1>
    <p>Ashana needs the internet to show live portions and your order status. Your cart is saved on this device.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
